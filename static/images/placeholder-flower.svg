<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background with premium subtle pattern -->
  <rect width="400" height="400" fill="#FDE8EF" rx="24"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#2E5A44" stroke-width="2" stroke-dasharray="6,6" opacity="0.15" />
  
  <!-- Stylized Elegant Flower Vector -->
  <g transform="translate(200, 180)">
    <!-- Leaves -->
    <path d="M-40,80 Q-80,60 -60,20 Q-20,40 -40,80 Z" fill="#D4EDDA" stroke="#2E5A44" stroke-width="2.5" />
    <path d="M40,80 Q80,60 60,20 Q20,40 40,80 Z" fill="#D4EDDA" stroke="#2E5A44" stroke-width="2.5" />
    
    <!-- Stem -->
    <path d="M0,0 Q-10,50 0,100" fill="none" stroke="#2E5A44" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Flower Petals (8-petal geometric mandala) -->
    <g id="petals">
      <!-- Petal 1 (Top) -->
      <path d="M0,0 C-15,-40 0,-70 0,-70 C0,-70 15,-40 0,0" fill="#d88195" stroke="#2E5A44" stroke-width="2.5" opacity="0.9" />
      <!-- Petal 2 -->
      <path d="M0,0 C-15,-40 0,-70 0,-70 C0,-70 15,-40 0,0" fill="#e7a4b4" stroke="#2E5A44" stroke-width="2.5" opacity="0.9" transform="rotate(45)" />
      <!-- Petal 3 -->
      <path d="M0,0 C-15,-40 0,-70 0,-70 C0,-70 15,-40 0,0" fill="#d88195" stroke="#2E5A44" stroke-width="2.5" opacity="0.9" transform="rotate(90)" />
      <!-- Petal 4 -->
      <path d="M0,0 C-15,-40 0,-70 0,-70 C0,-70 15,-40 0,0" fill="#e7a4b4" stroke="#2E5A44" stroke-width="2.5" opacity="0.9" transform="rotate(135)" />
      <!-- Petal 5 -->
      <path d="M0,0 C-15,-40 0,-70 0,-70 C0,-70 15,-40 0,0" fill="#d88195" stroke="#2E5A44" stroke-width="2.5" opacity="0.9" transform="rotate(180)" />
      <!-- Petal 6 -->
      <path d="M0,0 C-15,-40 0,-70 0,-70 C0,-70 15,-40 0,0" fill="#e7a4b4" stroke="#2E5A44" stroke-width="2.5" opacity="0.9" transform="rotate(225)" />
      <!-- Petal 7 -->
      <path d="M0,0 C-15,-40 0,-70 0,-70 C0,-70 15,-40 0,0" fill="#d88195" stroke="#2E5A44" stroke-width="2.5" opacity="0.9" transform="rotate(270)" />
      <!-- Petal 8 -->
      <path d="M0,0 C-15,-40 0,-70 0,-70 C0,-70 15,-40 0,0" fill="#e7a4b4" stroke="#2E5A44" stroke-width="2.5" opacity="0.9" transform="rotate(315)" />
    </g>
    
    <!-- Flower Center Core -->
    <circle cx="0" cy="0" r="18" fill="#FFF3CD" stroke="#2E5A44" stroke-width="2.5" />
    <circle cx="0" cy="0" r="8" fill="#FFC107" />
  </g>
  
  <!-- Subtle typography saying "Antigravity Flowers" -->
  <text x="200" y="325" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="600" fill="#2E5A44" text-anchor="middle" letter-spacing="1">ANTIGRAVITY FLOWERS</text>
  <text x="200" y="345" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="400" fill="#d88195" text-anchor="middle" letter-spacing="0.5">Fresh Botanical Creation</text>
</svg>
